modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="explorersfix"
version="${file.jarVersion}"
displayName="Explorer's Fix"
authors="nins77"
displayTest="IGNORE_ALL_VERSION"
description='''
Explorer's Fix is a dual-sided companion for Explorer's Compass. Client mixins
provide Chinese names and GUI/search caches; common mixins provide optional
server-side registry and search caches when installed on a server.

It displays Chinese structure names together with the English name, for example:
甘草女巫塔 (Licowitch Tower)

Both the Chinese and English text remain searchable in the compass GUI.
Structure names can come from the structure's own
structure.<namespace>.<path> translation key, automatically harvested related
translations, or an editable alias file at:
config/explorersfix/names.json

The name resolution is fully offline. Unknown names are generated from a
bundled word table and evidence from local language files. Names that would
require transliteration are left in English; no network service is used.
Chinese, English and collected aliases are all searchable.
Proper nouns learned from a mod are reused only within that mod's namespace.
'''

[[dependencies.explorersfix]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.explorersfix]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

[[dependencies.explorersfix]]
modId="explorerscompass"
mandatory=true
versionRange="[1.20.1-1.3.3,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="explorersfix.mixins.json"
